[tool.ruff]
target-version = "py313"
line-length = 100
include = ["app.py", "servicepulse/**/*.py", "scripts/**/*.py", "tests/**/*.py", "migrations/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"migrations/env.py" = ["E402"]

[tool.coverage.run]
source = ["servicepulse", "app"]

[tool.coverage.report]
show_missing = true

